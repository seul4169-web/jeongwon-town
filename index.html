<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5a623">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="정원이의 마을">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>정원이의 마을</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--ink:#2f3a45;--soft:#6c7a86;--good:#2fa36b;--bad:#e5574f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0}
body{font-family:'Gowun Dodum',sans-serif;color:var(--ink);background:#dff1ff;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
.j{font-family:'Jua',sans-serif;font-weight:normal}
.top{display:flex;align-items:center;gap:10px;padding:10px 18px;background:#ffffffe6;box-shadow:0 2px 0 #c8dceb;position:sticky;top:0;z-index:20}
.top h1{font-family:'Jua',sans-serif;font-weight:normal;font-size:26px;margin:0;color:#e0861a;letter-spacing:1px;cursor:pointer;white-space:nowrap}
.top .sp{flex:1}
.pill{background:#fff;border-radius:999px;padding:7px 14px;font-family:'Jua',sans-serif;font-size:18px;box-shadow:0 2px 0 #d5e2ec;white-space:nowrap}
.pill.t{color:#2e7bbf}.pill.s{color:#d08a00}.pill.m{color:#7a4fc9}
.tb{background:#fff4dc;border-radius:14px;padding:8px 12px;font-family:'Jua',sans-serif;font-size:17px;box-shadow:0 3px 0 #ecd29a;white-space:nowrap}
#map{display:block;width:100%;height:calc(100vh - 62px)}
.bl{cursor:pointer}
#hero{transition:transform 1.8s cubic-bezier(.45,.05,.55,.95)}
.hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#ffffffe8;border-radius:999px;padding:9px 18px;font-size:17px;box-shadow:0 2px 0 #cfdde8;pointer-events:none;white-space:nowrap}

/* ===== 건물 안 공통 ===== */
#v{display:none;min-height:calc(100vh - 62px);padding:0 0 60px;--card:#fff;--opt:#eef5ff;--optsh:#cddcf0;--acc:#f5a623;--accsh:#cf8611;--title:#2f3a45}
#v.on{display:block}
.band{height:18px}
.wrap{max-width:1040px;margin:0 auto;padding:14px 18px 0}
.btitle{display:flex;align-items:center;gap:14px;margin:4px 0 14px}
.btitle .e{font-size:50px;line-height:1}
.btitle h2{font-family:'Jua',sans-serif;font-weight:normal;font-size:32px;margin:0;color:var(--title)}
.btitle p{margin:2px 0 0;color:var(--soft);font-size:16px}
.back{background:var(--card);border-radius:16px;padding:10px 16px;font-family:'Jua',sans-serif;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.15);margin-left:auto;white-space:nowrap}
.scene{width:100%;display:block;border-radius:26px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.hs{cursor:pointer}
.hs:active{transform:translateY(3px)}
.lvl{font-size:15px;color:var(--soft);text-align:right;margin-top:10px}
.qz{background:var(--card);border-radius:26px;padding:22px 26px;box-shadow:0 6px 0 rgba(0,0,0,.12);position:relative}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qhead .n{font-family:'Jua',sans-serif;font-size:20px;color:var(--soft)}
.dots{margin-left:auto;font-size:17px;letter-spacing:3px;text-align:right}
.story{font-size:24px;line-height:1.6;margin:4px 0;word-break:keep-all}
.story b{font-family:'Jua',sans-serif;font-weight:normal;color:#d0710a}
.eq{font-family:'Jua',sans-serif;font-size:42px;text-align:center;margin:10px 0 4px;color:#2e6aa8;letter-spacing:2px}
.eq .box{display:inline-block;min-width:56px;border:4px dashed #e2a43b;border-radius:12px;color:#e2a43b;line-height:1.1;padding:0 6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}
.opt{background:var(--opt);border-radius:18px;padding:16px 14px;font-family:'Jua',sans-serif;font-size:22px;text-align:center;box-shadow:0 4px 0 var(--optsh);word-break:keep-all;line-height:1.35}
.opts.num .opt{font-size:40px;padding:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt.right{background:#d8f5e3!important;box-shadow:0 4px 0 #9fd9b6!important;color:#1d6b43!important}
.opt.wrong{background:#ffe0dc!important;box-shadow:0 4px 0 #f1b0a8!important;color:#a03a33!important}
.opt:disabled{cursor:default}
.ex{margin-top:16px;background:#fff7e6;color:#2f3a45;border-radius:18px;padding:14px 18px;font-size:20px;line-height:1.6;display:none;word-break:keep-all}
.ex.on{display:block}
.ex b{font-family:'Jua',sans-serif;font-weight:normal}
.next{display:none;margin:16px auto 0;background:var(--acc);color:#fff;border-radius:18px;padding:14px 44px;font-family:'Jua',sans-serif;font-size:24px;box-shadow:0 4px 0 var(--accsh)}
.next.on{display:block}
.end{text-align:center}
.end .big{font-size:80px}
.end h3{font-family:'Jua',sans-serif;font-weight:normal;font-size:32px;margin:6px 0}
.end p{font-size:20px;line-height:1.6;word-break:keep-all}
.think{background:#eef0ff;border-radius:18px;padding:14px 18px;font-size:20px;line-height:1.6;margin:14px auto 0;max-width:720px;text-align:left;word-break:keep-all}
.think b{font-family:'Jua',sans-serif;font-weight:normal;color:#5a48c4}
.row{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.sbtn{background:#fff;border-radius:16px;padding:12px 22px;font-family:'Jua',sans-serif;font-size:21px;box-shadow:0 4px 0 #c9d4dc;color:#2f3a45}
.sbtn.go{background:var(--good);color:#fff;box-shadow:0 4px 0 #1e7d50}
.say{background:#e9e2ff;border-radius:14px;padding:8px 14px;font-family:'Jua',sans-serif;font-size:19px;color:#5b43b5;vertical-align:middle}
.word{font-family:'Jua',sans-serif;font-size:64px;text-align:center;letter-spacing:4px;color:#2e6aa8;margin:8px 0}
.emo{font-size:100px;text-align:center;line-height:1.1}
.bubble{display:flex;gap:14px;align-items:center;background:#f4f7fa;border-radius:20px;padding:12px 16px;margin:6px 0}
.bubble .who{font-size:64px;line-height:1}
.bubble .say2{font-size:23px;line-height:1.5;word-break:keep-all}

/* 십 칸 틀 */
.tfs{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.tf{display:grid;grid-template-columns:repeat(5,46px);grid-auto-rows:46px;gap:4px;padding:8px;border-radius:12px;background:var(--tfbg,#e7eef5);border:3px solid var(--tfline,#c3d1de)}
.tf i{font-style:normal;display:flex;align-items:center;justify-content:center;font-size:30px;border-radius:8px;background:var(--tfcell,#fff)}
.tf i.a{background:var(--tfa,#fff)}
.tf i.b{background:#cfe6ff}
.tf i.c{background:#e3d7ff}
.tf i.q{background:#fff3c4;font-size:24px}
.tf i.x{opacity:.3;position:relative}
.tf i.x::after{content:"✕";position:absolute;color:#e5574f;font-size:34px;opacity:1}
.tf i.e{background:var(--tfcell,#fff);opacity:.55}

/* 레이스 */
.track{position:relative;height:150px;background:#5b6670;border-radius:20px;margin:10px 0 6px;overflow:hidden}
.lane{position:absolute;left:0;right:0;height:2px;top:74px;background:repeating-linear-gradient(90deg,#fff 0 30px,transparent 30px 60px)}
.flag{position:absolute;right:12px;top:0;bottom:0;width:26px;background:repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/13px 13px}
.car{position:absolute;font-size:52px;left:6px;transition:left .6s ease;transform:scaleX(-1)}
.car.me{top:80px}.car.rv{top:8px;transition:left 1s linear}
.racelab{display:flex;justify-content:space-between;font-size:16px;color:var(--soft)}
/* 크레인 */
.crane{display:flex;gap:20px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.tower{width:200px;min-height:300px;background:linear-gradient(#e9f4ff,#fff);border-radius:16px;border:3px dashed #b9cfe2;display:flex;flex-direction:column-reverse;align-items:center;padding:8px;position:relative}
.goal{position:absolute;top:8px;left:0;right:0;text-align:center;font-family:'Jua',sans-serif;font-size:20px;color:#c46d00}
.blk{width:150px;border-radius:8px;font-family:'Jua',sans-serif;font-size:26px;color:#fff;text-align:center;margin-top:4px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.pile{display:grid;grid-template-columns:repeat(3,110px);gap:12px}
.pblk{height:80px;border-radius:14px;font-family:'Jua',sans-serif;font-size:34px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.pblk:disabled{opacity:.25}
/* 순서 카드 */
.seq{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:12px}
.sc{background:var(--opt);border-radius:18px;padding:14px 10px;text-align:center;box-shadow:0 4px 0 var(--optsh);position:relative;min-height:120px}
.sc .e{font-size:44px}
.sc .t{font-family:'Jua',sans-serif;font-size:19px;line-height:1.3;margin-top:4px;word-break:keep-all}
.sc .no{position:absolute;top:-10px;left:-6px;width:38px;height:38px;border-radius:50%;background:var(--good);color:#fff;font-family:'Jua',sans-serif;font-size:22px;line-height:38px;display:none}
.sc.on{background:#dff5e7;box-shadow:0 4px 0 #a9dcbc}
.sc.on .no{display:block}
.sc.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* 화석 발굴 */
.digw{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:20px;align-items:start}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#b98d4f;padding:10px;border-radius:18px}
.tile{aspect-ratio:1;border-radius:12px;background:repeating-linear-gradient(45deg,#d9b77a 0 10px,#cfab6c 10px 20px);font-size:40px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.tile.open{background:#f5ead2;font-size:15px;line-height:1.3;padding:6px;font-family:'Jua',sans-serif;cursor:default;display:flex;flex-direction:column;align-items:center;justify-content:center;word-break:keep-all}
.tile.open .ce{font-size:34px}
.cluelist{font-size:19px;line-height:1.7}
/* 공룡 키 */
.dinos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.dcard{background:var(--opt);border-radius:20px;padding:14px;text-align:center;box-shadow:0 4px 0 var(--optsh)}
.dcard .e{font-size:54px}
.dcard .n{font-family:'Jua',sans-serif;font-size:20px;word-break:keep-all}
.dcard .m{font-size:20px;color:#8a6a2a;margin-top:2px}
.dcard .ord{font-family:'Jua',sans-serif;font-size:28px;color:var(--good);height:34px}
.dcard.pick{background:#dff5e7}
.bar{height:14px;background:#d9a441;border-radius:7px;margin:8px auto 0}
/* 몸 지도 */
.bodyw{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:20px;align-items:start}
.org{cursor:pointer}
.org.hit{stroke:#2fa36b;stroke-width:6}
.org.miss{stroke:#e5574f;stroke-width:6}
/* 스티커 */
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.sk{background:#fff;border-radius:20px;padding:14px 8px;text-align:center;box-shadow:0 4px 0 #d6e2ea}
.sk .e{font-size:54px}
.sk .n{font-family:'Jua',sans-serif;font-size:17px;margin-top:4px}
.sk.lock .e{filter:grayscale(1) brightness(1.5);opacity:.45}
.sk button{margin-top:8px;background:#fff1cf;border-radius:12px;padding:7px 12px;font-family:'Jua',sans-serif;font-size:16px;box-shadow:0 3px 0 #ecd29a}
.sk button:disabled{opacity:.45}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.stp{background:#fff;border-radius:14px;padding:10px 12px;font-size:16px;box-shadow:0 3px 0 #d6e2ea;text-align:left}
.stp b{font-family:'Jua',sans-serif;font-weight:normal}
.stp.now{outline:3px solid #7a4fc9}
.stp.past{opacity:.6}

/* ===== 건물별 분위기 ===== */
/* 공사장: 모래·콘크리트, 노랑-검정 안전 띠 */
#v.th-site{background:#efe2c4;--card:#fffaf0;--opt:#ffd84d;--optsh:#b8901c;--acc:#2f3a45;--accsh:#000;--title:#3a2f1c;--tfbg:#c9a46a;--tfline:#8a6a3a;--tfcell:#e9d3a6}
#v.th-site .band{background:repeating-linear-gradient(-45deg,#ffcc00 0 26px,#222 26px 52px)}
#v.th-site .qz{border:6px solid transparent;background:linear-gradient(#fffaf0,#fffaf0) padding-box,repeating-linear-gradient(-45deg,#ffcc00 0 18px,#2b2b2b 18px 36px) border-box}
#v.th-site .opt{color:#2b2b2b;border:3px solid #2b2b2b;border-radius:10px}
/* 정비소: 아스팔트, 차선, 번호판 버튼 */
#v.th-garage{background:#3b434b;--card:#f4f7fa;--opt:#fff;--optsh:#2b3a4a;--acc:#2f76c0;--accsh:#1f4f84;--title:#fff;--soft:#c7d2dc;--tfbg:#5b6670;--tfline:#ffd84d;--tfcell:#7b8690}
#v.th-garage .band{background:repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/18px 18px}
#v.th-garage .qz{--soft:#6c7a86}
#v.th-garage .opt{border:4px solid #2b3a4a;border-radius:10px;letter-spacing:1px}
#v.th-garage .lvl{color:#c7d2dc}
/* 공룡 박물관: 모래 발굴장, 돌 버튼 */
#v.th-dino{background:#e8d6a8 radial-gradient(#d6bf88 2px,transparent 3px) 0 0/26px 26px;--card:#fbf5e4;--opt:#e3d3b0;--optsh:#a88c5a;--acc:#3a944f;--accsh:#256b37;--title:#3c2f1a;--tfbg:#c2a36d;--tfline:#7a5a2a;--tfcell:#f3e6c6}
#v.th-dino .band{background:repeating-linear-gradient(90deg,#3a944f 0 40px,#4caf6a 40px 80px)}
#v.th-dino .qz{border:5px solid #c8b083}
#v.th-dino .opt{border-radius:30px 14px 26px 16px}
/* 우리 몸: 분홍 세포 무늬, 알약 버튼 */
#v.th-body{background:#ffe9ee radial-gradient(circle,#ffd3dd 14px,transparent 15px) 0 0/60px 60px;--card:#fff;--opt:#ffe3ea;--optsh:#f0a9ba;--acc:#e8607a;--accsh:#b8405a;--title:#7a2238;--tfbg:#ffd3dd;--tfline:#e8607a;--tfcell:#fff}
#v.th-body .band{background:linear-gradient(90deg,#e8607a,#f59bb0,#e8607a)}
#v.th-body .opt{border-radius:999px}
#v.th-shop{background:#fff6e0}

#stop{position:fixed;inset:0;background:#1d3550ee;display:none;align-items:center;justify-content:center;z-index:50;color:#fff;text-align:center;padding:20px}
#stop.on{display:flex}
#stop .e{font-size:110px}
#stop h2{font-family:'Jua',sans-serif;font-weight:normal;font-size:40px;margin:8px 0}
#stop p{font-size:22px;line-height:1.6}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-20px);background:#2f3a45;color:#fff;padding:12px 22px;border-radius:999px;font-size:19px;opacity:0;transition:.35s;z-index:40;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:700px){
  .top h1{font-size:19px}.pill{font-size:14px;padding:5px 9px}.tb{font-size:13px;padding:6px 8px}.pill.m{display:none}
  .bodyw,.digw{grid-template-columns:1fr}.dinos{grid-template-columns:1fr}.pile{grid-template-columns:repeat(3,86px)}
  .story{font-size:20px}.opt{font-size:19px}.tf{grid-template-columns:repeat(5,34px);grid-auto-rows:34px}.tf i{font-size:22px}
}

/* ===== 3판 추가 ===== */
#map{height:calc(100vh - 62px)}
.plan{position:fixed;left:50%;transform:translateX(-50%);top:70px;z-index:15;display:flex;gap:10px;align-items:center;background:#ffffffee;border-radius:999px;padding:8px 18px;box-shadow:0 3px 0 #c8dceb;font-size:17px;white-space:nowrap}
.plan span{opacity:.7}.plan span.ok{opacity:1;color:#1d7a4a}
.me{display:flex;align-items:center;gap:8px;background:#ffffffd9;border-radius:20px;padding:4px 14px 4px 6px;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.me .nm{font-size:20px;color:#2f3a45;white-space:nowrap}.me .pt{font-size:14px;color:#6c7a86}
.bt{min-width:0}
.btitle{flex-wrap:wrap}
.wt{font-size:16px;color:#6c7a86}
.hint2{text-align:center;color:#6c7a86;font-size:16px;margin:4px 0}
.tools{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.tool{background:#eef5ff;border-radius:18px;padding:12px 18px;font-family:'Jua',sans-serif;font-size:19px;box-shadow:0 4px 0 #cddcf0;display:flex;flex-direction:column;align-items:center;min-width:120px}
.tool span{font-size:40px}.tool.on{background:#dff5e7;box-shadow:0 4px 0 #a9dcbc}
.clues{display:grid;gap:8px;margin:8px 0}
.clue{background:#fff7e6;border-radius:14px;padding:10px 14px;font-size:20px;line-height:1.5;color:#2f3a45}
.gridw{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;--gc:72px}
.grid{display:grid;gap:5px;background:#8c96a0;padding:8px;border-radius:16px;justify-content:start}
.th-site .grid{background:#b98d4f}
.gc{width:var(--gc);height:var(--gc);background:#d9e2ea;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative}
.th-site .gc{background:#f0dcae}.gc.wall{background:#9aa5b1}.th-site .gc.wall{background:#a88356}
.bot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;background:#ffffff88;border-radius:10px;outline:4px solid #ffcc00}
.bot i{font-style:normal;font-size:20px;position:absolute;right:2px;top:0}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;background:#fff;border-radius:14px;padding:8px;border:3px dashed #c3d1de}
.prog span{font-size:28px;background:#eef5ff;border-radius:8px;padding:2px 4px}.prog span.now{background:#ffcc00}
.cmds{display:grid;grid-template-columns:repeat(4,72px);gap:8px;margin:12px 0}
.cmd{height:68px;border-radius:14px;background:var(--opt);box-shadow:0 4px 0 var(--optsh);font-size:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cmd small{font-family:'Jua',sans-serif;font-size:13px;color:#2f3a45}
.gmsg{font-size:20px;color:#a03a33;min-height:28px;margin-top:8px}
.mus{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.mz{background:#fbf5e4;border:5px solid #c8b083;border-radius:18px;padding:14px;text-align:center}
.mz .e{font-size:64px}.mz .n{font-size:21px}.mz .c{font-size:15px;color:#6c5a3a;line-height:1.5;margin-top:4px}
.mz.lock{opacity:.6;border-style:dashed}
.bonew{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:20px}
.board{background:#f3e6c6;border-radius:18px;padding:14px}.bh{text-align:center;font-size:70px;line-height:1.1}.bh .j{font-size:22px}
.slot{background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:17px;line-height:1.4;border:3px dashed #c8b083}
.slot.on{border-style:solid;border-color:#3a944f;background:#e9f7ee}.slot.now{border-color:#e2a43b;background:#fff6dd}
.meas{background:#fff;border-radius:16px;padding:14px;margin:10px 0}
.mrow{display:flex;align-items:center;gap:10px;margin:8px 0}.mrow .lb{font-size:34px;width:44px}
.mbar{height:44px;border-radius:10px;background:#d9a441;color:#fff;font-family:'Jua',sans-serif;font-size:20px;display:flex;align-items:center;justify-content:center;min-width:40px}
.units{display:flex;height:44px;min-width:4px}.units i{flex:1;font-style:normal;font-size:28px;text-align:center;border-right:2px dashed #c3d1de;overflow:hidden}

<script>
/* ===================== 문제 자료 =====================
   퀴즈 형식: [문제, [정답, 오답, 오답], 설명]
   새 문제를 넣을 때는 각 묶음 끝에 같은 형식으로 한 줄씩 추가하면 돼요. */

const QZ={
site:[
 ["긴 팔 끝의 바가지(버킷)로 땅을 파는 중장비는?",["굴착기","레미콘","지게차"],"굴착기는 땅을 파는 중장비야. '포클레인'이라고도 부르는데, 원래는 굴착기를 만든 프랑스 회사 이름이었어!"],
 ["커다란 통을 빙글빙글 돌리며 콘크리트를 싣고 가는 차는?",["레미콘(믹서트럭)","덤프트럭","불도저"],"통을 계속 돌려야 콘크리트가 가는 길에 굳지 않아. 멈추면 돌처럼 딱딱해져 버려!"],
 ["흙이나 돌을 싣고 가서 짐칸을 번쩍 기울여 쏟아 내는 차는?",["덤프트럭","소방차","견인차"],"덤프트럭 짐칸 아래에는 힘센 기둥(유압 실린더)이 있어서 짐칸을 밀어 올려."],
 ["앞에 달린 넓은 판(블레이드)으로 흙을 밀어 평평하게 만드는 중장비는?",["불도저","크레인","롤러"],"불도저는 힘이 아주 세서 큰 흙더미도 밀어 버려."],
 ["무거운 철근이나 벽돌을 아주 높은 곳까지 들어 올리는 기계는?",["크레인","굴착기","지게차"],"높은 아파트를 지을 때는 '타워크레인'을 써. 기사님은 꼭대기 운전석까지 사다리로 올라가!"],
 ["무거운 쇠바퀴로 길을 꾹꾹 눌러 단단하고 평평하게 만드는 차는?",["롤러","덤프트럭","구급차"],"아스팔트를 깔고 나면 롤러가 지나가며 꾹꾹 눌러 줘야 길이 튼튼해져."],
 ["두 갈래 포크로 짐을 떠서 옮기는 차는?",["지게차","불도저","레미콘"],"지게차는 창고나 공장에서 무거운 상자를 높은 선반에 올려 줘."],
 ["굴착기 중에 바퀴 대신 '무한궤도(캐터필러)'를 단 이유는?",["진흙이나 울퉁불퉁한 땅에서도 빠지지 않으려고","더 빨리 달리려고","소리가 예뻐서"],"넓은 띠가 무거운 몸무게를 넓게 나눠 줘서 푹 빠지지 않아. 탱크도 같은 원리야!"],
 ["공사장에서 사람들이 꼭 써야 하는 것은?",["안전모","왕관","수영 모자"],"위에서 무엇이 떨어질 수 있어서 머리를 지켜 주는 안전모가 꼭 필요해."],
 ["중장비가 노란색이나 주황색인 경우가 많은 이유는?",["멀리서도 눈에 잘 띄어 안전해서","노란 페인트만 있어서","바나나를 좋아해서"],"눈에 확 띄는 색이라 사람과 다른 차가 금방 알아보고 조심할 수 있어."],
 ["중장비가 뒤로 갈 때 '삐- 삐-' 소리가 나는 이유는?",["뒤에 있는 사람에게 조심하라고 알리려고","노래를 부르려고","엔진이 고장 나서"],"운전석에서는 뒤가 잘 안 보여. 그래서 소리로 '비켜 주세요!' 하고 알려."],
 ["굴착기 팔 끝을 바꿔 끼울 수 있어. 단단한 바위를 깨려면 무엇을 끼울까?",["브레이커(쪼는 망치)","버킷(바가지)","빗자루"],"브레이커는 딱따구리처럼 '다다다다' 쪼아서 바위를 부숴."],
 ["콘크리트를 아주 높은 층까지 쏘아 올리는 긴 팔 달린 차는?",["콘크리트 펌프카","견인차","청소차"],"펌프카는 접혀 있던 팔을 쭉쭉 펴서 높은 곳까지 콘크리트를 보내 줘."],
 ["앞에 커다란 바가지가 달려 흙을 '퍼서' 트럭에 실어 주는 차는?",["로더(휠로더)","롤러","레미콘"],"로더는 흙을 퍼 담는 일을 잘해. 굴착기는 땅을 파는 일을 잘하고!"],
 ["산 밑으로 터널을 뚫는 커다란 기계는?",["터널 굴착기(TBM)","지게차","덤프트럭"],"앞이 빙글빙글 도는 거대한 두더지 같은 기계야. 지하철 터널도 이렇게 뚫어."],
 ["중장비가 힘이 센 비밀 '유압'은 무엇을 이용할까?",["좁은 관 속 기름을 세게 미는 힘","풍선 바람","자석"],"기름을 꾹 밀면 큰 힘이 생겨. 굴착기 팔도 이 힘으로 움직여!"],
 ["새 아스팔트를 길 위에 고르게 깔아 주는 기계는?",["아스팔트 피니셔","크레인","지게차"],"피니셔가 뜨거운 아스팔트를 깔면, 뒤따라 롤러가 꾹꾹 다져."],
 ["길고 얇은 칼날로 땅을 아주 반듯하게 긁어 다듬는 차는?",["그레이더","레미콘","덤프트럭"],"그레이더는 배 아래쪽 칼날로 땅을 살살 긁어서 도로 바닥을 반듯하게 만들어."],
 ["건물 아래 땅속 깊이 기둥(파일)을 '쾅쾅' 박는 기계는?",["항타기","롤러","지게차"],"땅이 무르면 건물이 기울 수 있어서 튼튼한 기둥을 깊이 박아 받쳐."],
 ["굴착기 엉덩이(뒤쪽)가 뚱뚱하고 무거운 이유는?",["무거운 것을 들 때 앞으로 넘어지지 않으려고","앉기 편하려고","짐을 넣으려고"],"뒤쪽의 무거운 쇳덩이를 '균형추'라고 해. 시소처럼 균형을 잡아 줘."],
 ["타워크레인이 점점 키가 커지는 방법은?",["마디를 하나씩 끼워 넣어서","물을 줘서","풍선을 불어서"],"건물이 올라갈수록 크레인도 쇠 마디를 끼워 키를 키워."],
 ["레미콘 통 안에 든 콘크리트는 무엇을 섞은 걸까?",["시멘트·모래·자갈·물","우유와 밀가루","흙과 나뭇잎"],"섞어 두면 시간이 지나며 딱딱하게 굳어서 건물의 뼈대가 돼."],
 ["콘크리트 안에 철근을 넣는 이유는?",["더 튼튼해서 잘 안 부러지게","더 가벼워지게","반짝이게"],"콘크리트는 누르는 힘에 강하고, 철근은 당기는 힘에 강해. 둘이 힘을 합쳐!"],
 ["굴착기 윗부분이 빙글 한 바퀴 돌 수 있어서 좋은 점은?",["차를 안 움직여도 여러 방향에서 일할 수 있어요","어지러워서 재미있어요","빨리 달릴 수 있어요"],"제자리에서 흙을 파고, 몸을 돌려 바로 옆 트럭에 실을 수 있어."],
 ["공사장 출구에서 트럭 바퀴를 물로 씻는 이유는?",["흙이 도로에 묻어 더러워지지 않게","트럭이 목말라서","바퀴를 반짝이게 하려고"],"바퀴에 묻은 흙이 도로에 떨어지면 먼지가 나고 미끄러워져."],
 ["공사장 둘레에 높은 울타리를 치는 이유는?",["사람이 다치지 않게, 먼지와 소음을 막으려고","숨바꼭질하려고","중장비가 도망가지 않게"],"공사장은 위험한 곳이라 아무나 들어가면 안 돼."],
 ["큰 중장비는 대부분 어떤 연료를 넣을까?",["경유(디젤)","우유","주스"],"경유를 쓰는 디젤 엔진은 힘이 세서 무거운 일을 잘해. 요즘은 전기 중장비도 나오고 있어."],
 ["광산에서 쓰는 가장 큰 덤프트럭 바퀴는 얼마나 클까?",["어른 키의 두 배쯤","자전거 바퀴만큼","축구공만큼"],"바퀴 하나가 4미터 가까이 돼. 운전석까지 계단으로 올라가야 해!"],

 ["오래된 건물을 부술 때 굴착기 팔에 끼우는 커다란 집게는?",["크러셔(압쇄기)","숟가락","빗자루"],"크러셔는 콘크리트를 '와작' 집어 부숴. 먼지가 나지 않게 물을 뿌리면서 해."],

garage:[

 ["왼쪽이나 오른쪽으로 갈 때 깜빡깜빡 미리 알려 주는 불은?",["방향지시등(깜빡이)","전조등","실내등"],"깜빡이를 켜면 다른 차들이 '저쪽으로 가는구나' 하고 알 수 있어."],
 ["구급차 앞에 'AMBULANCE'가 거꾸로 써 있는 이유는?",["앞차가 거울로 보면 바로 읽히라고","글씨를 잘못 써서","멋있어서"],"거울에 비치면 글자가 뒤집혀 보이거든! 앞차 운전자가 백미러로 보면 똑바로 읽혀."],

 ["고장 난 차를 끌고 정비소까지 데려가는 차는?",["견인차(렉카)","레미콘","버스"],"견인차는 고장 난 차의 앞을 들어 올려서 끌고 가."],

 ["주차된 큰 차 바로 뒤나 앞에서 놀면 위험한 이유는?",["운전석에서 아이가 잘 안 보여서","차가 시끄러워서","차가 더러워서"],"키가 작은 어린이는 운전석에서 거의 안 보여. 차 근처에서는 꼭 어른 손을 잡자."],
 ["어린이 보호구역(스쿨존)에서 차는 어떻게 달려야 할까?",["천천히(시속 30km 이하)","아주 빨리","빵빵거리며"],"학교 앞에서는 어린이가 갑자기 뛰어나올 수 있어서 천천히 달려야 해."],

 ["경주 중에 레이싱카가 들어와서 타이어를 재빨리 바꾸는 곳은?",["피트","주차장","세차장"],"피트에서는 여러 정비사가 힘을 합쳐 몇 초 만에 타이어 네 개를 바꿔!"],

 ["목이 아주 길어서 높은 나뭇잎을 먹던 공룡은?",["브라키오사우루스","벨로키랍토르","안킬로사우루스"],"브라키오사우루스는 머리를 들면 아파트 4층쯤 높이였어!"],
 ["등에 뾰족한 판이 줄지어 있고 꼬리에 가시가 있는 공룡은?",["스테고사우루스","티라노사우루스","프테라노돈"],"꼬리 가시를 휘둘러서 사나운 공룡을 쫓아냈을 거라고 해."],
 ["몸이 갑옷처럼 단단하고 꼬리 끝에 곤봉이 달린 공룡은?",["안킬로사우루스","브라키오사우루스","벨로키랍토르"],"안킬로사우루스는 '살아 있는 탱크' 같았어."],
 ["하늘을 날던 프테라노돈은 공룡일까?",["공룡이 아니라 '익룡'이에요","공룡이에요","새예요"],"프테라노돈은 공룡과 같은 시대에 살았지만 하늘을 나는 '익룡'이라는 다른 무리야."],
 ["공룡의 아기는 어떻게 태어났을까?",["알에서 깨어났어요","엄마 배 속에서 태어났어요","나무에서 열렸어요"],"둥지를 짓고 알을 돌본 공룡도 있었대."],
 ["아주 옛날에 공룡이 살았다는 것을 어떻게 알 수 있을까?",["화석을 보고","공룡 사진을 보고","공룡이 쓴 일기를 보고"],"뼈, 이빨, 발자국, 알이 돌 속에 남은 것을 화석이라고 해."],
 ["화석을 찾고 연구해서 옛날 생물을 알아내는 과학자는?",["고생물학자","요리사","소방관"],"고생물학자는 붓과 작은 망치로 화석을 조심조심 꺼내."],
 ["이빨이 뾰족하고 날카로운 공룡은 무엇을 먹었을까?",["고기","풀","돌"],"뾰족한 이빨은 고기를 찢기 좋고, 납작한 이빨은 풀을 갈기 좋아."],
 ["공룡이 사라진 가장 큰 이유로 과학자들이 생각하는 것은?",["커다란 소행성(우주 돌)이 지구에 부딪혀서","모두 겨울잠을 자서","사람이 사냥해서"],"사람은 공룡이 사라지고 아주아주 오랜 뒤에야 나타났어. 그래서 사람과 공룡은 만난 적이 없어."],
 ["과학자들이 '공룡의 후손'이라고 말하는 동물은?",["새","고양이","물고기"],"새의 조상은 깃털 달린 작은 공룡이었어. 참새도 공룡의 먼 친척이야!"],
 ["벨로키랍토르의 진짜 모습에 가장 가까운 것은?",["칠면조만 하고 깃털이 있었어요","버스만큼 컸어요","코끼리처럼 털이 없었어요"],"영화 속 랩터보다 훨씬 작았어. 깃털이 있었다는 증거도 있어."],
 ["우리나라에서 공룡 발자국 화석이 아주 많이 발견된 곳은?",["경상남도 고성","서울 한가운데 빌딩","바다 한가운데"],"고성에는 공룡 발자국이 아주 많아서 공룡 박물관도 있어."],
 ["등에 커다란 돛이 있고 물가에서 물고기를 잡아먹던 공룡은?",["스피노사우루스","트리케라톱스","안킬로사우루스"],"스피노사우루스는 티라노사우루스보다도 길었을 거라고 해."],
 ["머리뼈가 볼링공처럼 두껍고 둥근 공룡은?",["파키케팔로사우루스","브라키오사우루스","프테라노돈"],"'두꺼운 머리 도마뱀'이라는 뜻이야."],
 ["공룡이 살던 아주 먼 옛날을 부르는 이름은?",["중생대","조선 시대","미래"],"중생대는 트라이아스기, 쥐라기, 백악기 세 시기로 나뉘어."],
 ["공룡 이름에 자주 붙는 '사우루스'는 무슨 뜻일까?",["도마뱀","사자","새"],"처음 공룡 화석을 발견한 사람들이 커다란 도마뱀이라고 생각했거든."],
 ["머리에 긴 나팔 같은 볏이 있어 '뿌우-' 소리를 냈을 것으로 보이는 공룡은?",["파라사우롤로푸스","티라노사우루스","안킬로사우루스"],"볏 속이 비어 있어서 소리를 울려 친구들과 이야기했을 거라고 해."],
 ["엄지손가락에 뾰족한 가시가 있던 초식공룡은?",["이구아노돈","스피노사우루스","프테라노돈"],"처음에는 이 가시를 코뿔소처럼 코 위의 뿔로 잘못 붙였었대!"],
 ["꼬리가 채찍처럼 아주 길었던 목 긴 공룡은?",["디플로도쿠스","트리케라톱스","벨로키랍토르"],"긴 꼬리를 휘둘러 '휙' 소리를 내며 적을 쫓았을지도 몰라."],
 ["공룡 똥도 화석이 될 수 있을까?",["네, 똥 화석도 있어요","아니요, 절대 안 돼요","공룡은 똥을 안 쌌어요"],"똥 화석 속을 보면 그 공룡이 무엇을 먹었는지 알 수 있어!"],
 ["바다에 살던 커다란 '모사사우루스'는 공룡일까?",["아니에요, 바다에 산 파충류예요","네, 공룡이에요","물고기예요"],"공룡은 땅 위에서 살았어. 바다와 하늘의 큰 파충류는 공룡과 다른 무리야."],
 ["털이 북슬북슬한 매머드는 공룡일까?",["아니에요, 코끼리의 친척이에요","네, 공룡이에요","새예요"],"매머드는 공룡이 사라지고 아주 오랜 뒤에 살았던 포유류야."],
 ["티라노사우루스와 스테고사우루스는 서로 만났을까?",["아니요, 사는 시대가 아주 많이 달랐어요","네, 매일 싸웠어요","둘은 같은 공룡이에요"],"스테고사우루스가 살던 때와 티라노사우루스가 살던 때는 수천만 년이나 떨어져 있어. 우리와 티라노 사이보다도 멀어!"],
 ["공룡과 도마뱀의 다리는 어떻게 다를까?",["공룡 다리는 몸 아래로 곧게 뻗어 있어요","공룡은 다리가 없어요","똑같아요"],"도마뱀은 다리가 옆으로 벌어져 있지만, 공룡은 다리가 몸 아래에 있어서 더 잘 걷고 달렸어."],
 ["목 긴 공룡이 일부러 삼켰을 것으로 보이는 돌의 쓰임은?",["배 속에서 나뭇잎을 갈아 주기","장난감으로 놀기","무거워지려고"],"닭이 작은 모래알을 먹는 것과 비슷해. 이런 돌을 '위석'이라고 해."],
 ["트리케라톱스 목 뒤의 넓은 판(프릴)은 어디에 썼을까?",["목을 지키고 친구들에게 뽐내기","날아다니기","물 마시기"],"넓은 프릴은 방패도 되고, 멋진 장식도 됐을 거야."],
 ["우리나라 보성에서 발견되어 나라 이름이 붙은 공룡은?",["코리아노사우루스","티라노사우루스","브라키오사우루스"],"'한국의 도마뱀'이라는 뜻이야. 땅에 굴을 파고 살았을지도 모른대."],
 ["공룡의 피부색은 어떻게 알아낼까?",["대부분 모르지만, 깃털 화석 속 아주 작은 색 알갱이로 짐작해요","사진을 봐요","모두 초록색이에요"],"그래서 공룡 그림의 색은 화가와 과학자가 상상해서 칠한 경우가 많아."],
 ["지금까지 발견된 공룡 중 가장 큰 공룡들은 어떤 무리일까?",["목과 꼬리가 긴 초식공룡","작은 육식공룡","하늘을 나는 공룡"],"아르젠티노사우루스 같은 목 긴 공룡은 길이가 30m도 넘었을 거야. 버스 세 대보다 길어!"],
 ["화석이 가장 잘 만들어지는 곳은?",["진흙이나 모래에 빨리 묻히는 곳","높은 산꼭대기","뜨거운 불 속"],"빨리 묻혀야 뼈가 부서지지 않고 오랜 시간 돌처럼 단단해질 수 있어."]
],
body:[
 ["온몸으로 피를 쿵쾅쿵쾅 보내 주는 펌프는?",["심장","위","뇌"],"심장은 내 주먹만 해. 하루 종일 한 번도 쉬지 않고 뛰어!"],
 ["숨을 쉬어서 공기 속 산소를 받아들이는 곳은?",["폐(허파)","간","콩팥"],"폐는 가슴 양쪽에 하나씩 있어. 숨을 들이쉬면 풍선처럼 부풀어."],
 ["먹은 음식을 꾹꾹 주물러 죽처럼 만드는 주머니는?",["위","심장","폐"],"위에서는 강한 위액이 나와서 음식을 녹여."],
 ["생각하고, 기억하고, 몸에게 명령을 내리는 곳은?",["뇌","배꼽","무릎"],"뇌는 몸의 대장이야. 정원이가 문제를 풀 때도 뇌가 열심히 일해!"],
 ["어른 몸에 있는 뼈는 몇 개쯤일까?",["206개쯤","10개쯤","1000개쯤"],"아기 때는 300개쯤 있다가 자라면서 몇 개씩 붙어서 206개쯤이 돼."],
 ["뼈가 하는 일로 맞는 것은?",["몸을 받치고 뇌·심장 같은 소중한 곳을 지켜요","음식을 녹여요","냄새를 맡아요"],"머리뼈는 뇌를, 갈비뼈는 심장과 폐를 지켜. 뼈 속에서는 피도 만들어져!"],
 ["팔다리를 당겨서 움직이게 해 주는 것은?",["근육","머리카락","손톱"],"근육이 줄었다 늘었다 하면서 뼈를 당겨. 운동을 하면 근육이 튼튼해져."],
 ["이를 닦아야 하는 가장 큰 이유는?",["세균이 이를 썩게 해서","이가 하얘지면 키가 커서","입이 심심해서"],"단 음식을 먹고 안 닦으면 세균이 산을 만들어 이에 구멍을 내."],
 ["젖니가 빠지고 새로 나는 이는?",["영구치","가짜 이","공룡 이"],"영구치는 평생 써야 하는 이야. 그래서 더 소중히 닦아야 해!"],
 ["달리기를 하면 심장이 빨리 뛰는 이유는?",["근육에 산소를 더 빨리 보내려고","심장이 무서워서","배가 고파서"],"근육이 일을 많이 하면 산소가 더 필요해. 그래서 심장과 폐가 바빠져."],
 ["음식 속 영양분을 몸속으로 빨아들이는 길고 꼬불꼬불한 관은?",["작은창자(소장)","목","콧구멍"],"작은창자를 쭉 펴면 길이가 어른 키의 세 배도 넘어!"],
 ["피 속 찌꺼기를 걸러서 오줌을 만드는 곳은?",["콩팥(신장)","심장","뇌"],"콩팥은 강낭콩 모양이고 허리 뒤쪽에 두 개가 있어."],
 ["넘어져 생긴 상처에 딱지가 생기는 이유는?",["피를 멈추고 세균을 막으며 새 살이 자라게 하려고","상처를 숨기려고","예뻐 보이려고"],"딱지는 상처를 덮는 반창고 같아. 억지로 떼지 말고 기다려 줘야 해."],
 ["눈을 깜빡이는 이유는?",["눈을 촉촉하게 하고 먼지를 닦으려고","졸려서만","눈이 심심해서"],"깜빡일 때마다 눈물이 눈을 닦아 줘. 자동차 와이퍼랑 비슷하지?"],
 ["밤에 잠을 푹 자면 몸에서 어떤 일이 생길까?",["키가 크는 데 도움을 주는 호르몬이 많이 나와요","뼈가 줄어들어요","심장이 멈춰요"],"잘 자는 동안 몸은 키를 키우고, 낮에 배운 것도 뇌에 차곡차곡 정리해."],
 ["피부가 하는 일로 맞는 것은?",["세균을 막고 뜨겁고 차가운 것을 느껴요","음식을 소화해요","생각을 해요"],"피부는 몸 전체를 감싸는 튼튼한 옷 같아. 몸에서 가장 넓은 기관이야!"],
 ["혀가 하는 일이 아닌 것은?",["숨을 걸러 줘요","맛을 느껴요","말할 때 소리를 만들어요"],"혀는 맛을 느끼고, 음식을 섞어 삼키게 돕고, 말소리도 만들어."],
 ["콧속의 코털이 하는 일은?",["먼지를 걸러 줘요","냄새를 만들어요","콧물을 먹어요"],"코털은 공기 속 먼지가 폐로 들어가지 않게 막는 문지기야."],
 ["침이 하는 일은?",["음식을 부드럽게 하고 소화를 시작해요","이를 하얗게 칠해요","잠을 오게 해요"],"밥을 오래 씹으면 단맛이 나는 이유도 침이 녹말을 바꾸기 때문이야."],
 ["귀가 하는 일 두 가지는?",["소리 듣기와 몸의 균형 잡기","냄새 맡기와 맛보기","숨쉬기와 먹기"],"귀 속 깊은 곳에는 몸이 기울었는지 알려 주는 기관이 있어. 빙글빙글 돌면 어지러운 이유야."],
 ["피가 빨간 이유는?",["산소를 나르는 적혈구가 빨개서","빨간 물감을 먹어서","심장이 빨개서"],"적혈구는 산소를 싣고 온몸을 도는 작은 배달 트럭 같아."],
 ["몸에 들어온 세균과 싸우는 '피 속 군인'은?",["백혈구","적혈구","손톱"],"백혈구는 세균을 찾아가서 잡아먹어. 몸을 지키는 경찰이자 군인이야."],
 ["감기에 걸렸을 때 열이 나는 이유는?",["몸이 바이러스와 싸우고 있어서","몸이 화가 나서","해를 많이 봐서"],"몸이 뜨거워지면 바이러스가 힘을 못 쓰고, 몸의 군인들은 더 힘을 내."],
 ["밖에서 놀고 와서 손을 씻는 이유는?",["손에 묻은 세균을 없애 병을 막으려고","손이 목말라서","손톱을 기르려고"],"비누 거품으로 30초 동안 구석구석 씻으면 세균이 쏙 빠져."],
 ["우리 몸에서 가장 긴 뼈는?",["넓적다리뼈","손가락뼈","귓속뼈"],"허벅지 속 넓적다리뼈는 아주 길고 튼튼해서 몸무게를 받쳐."],
 ["우리 몸에서 가장 작은 뼈는 어디에 있을까?",["귓속","발가락","등"],"귓속 등자뼈는 쌀알보다도 작아. 소리를 뇌로 전해 주는 일을 해."],

  const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;o.connect(g);g.connect(AC.destination);
  const s=AC.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.18,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d+.05);}catch(e){}}

 const saved=S.voice&&S.voice[pre];const c=voicesFor(pre);if(!c.length)return null;

 const exact=c.filter(v=>vnorm(v)===want),pool=exact.length?exact:c;

 const pool=shuf(bank.filter(x=>!seen.includes(kf(x))));let pick=pool.slice(0,n);

const STEPS=[null,
 {n:"5까지 모으기",ex:"2 + 3"},{n:"5까지 가르기",ex:"5는 2와 □"},{n:"5까지 빼기",ex:"5 − 2"},
 {n:"10까지 모으기",ex:"4 + 5"},{n:"10까지 가르기",ex:"8은 3과 □"},{n:"10까지 빼기",ex:"9 − 4"},
 {n:"10 만들기",ex:"7 + □ = 10"},{n:"세 수 더하기",ex:"3 + 7 + 2"},{n:"받아올림 있는 덧셈",ex:"8 + 5"},
 {n:"받아내림 있는 뺄셈",ex:"13 − 5"},{n:"몇십 더하기·두 자리 + 한 자리",ex:"30 + 20, 23 + 4"},
 {n:"두 자리 + 한 자리 (받아올림)",ex:"27 + 5"},{n:"두 자리 − 한 자리 (받아내림)",ex:"32 − 5"},{n:"두 자리 수끼리 더하고 빼기",ex:"36 + 25, 52 − 18"}];
const MAXSTEP=STEPS.length-1;
function genStep(st){let a,b,c,n,k;
 switch(st){
  case 1:a=R(1,4);b=R(1,5-a);k="add";break;
  case 2:n=R(2,5);a=R(1,n-1);k="split";break;
  case 3:a=R(2,5);b=R(1,a-1);k="sub";break;
  case 4:a=R(2,8);b=R(Math.max(1,6-a),10-a);k="add";break;
  case 5:n=R(6,10);a=R(1,n-1);k="split";break;
  case 6:a=R(6,10);b=R(1,a-1);k="sub";break;
  case 7:n=10;a=R(1,9);k="miss";break;
  case 8:if(Math.random()<.5){a=R(1,9);b=10-a;c=R(1,6);}else{a=R(1,5);b=R(1,8-a);c=R(1,10-a-b);}k="add3";break;
  case 9:a=R(3,9);b=R(11-a,9);k="add";break;
  case 10:a=R(11,18);b=R(a-9,9);k="sub";break;
  case 11:if(Math.random()<.5){const t=R(1,8);a=t*10;b=R(1,9-t)*10;}else{const t=R(1,8),u=R(0,7);a=t*10+u;b=R(1,9-u);}k="add";break;
  case 12:{const t=R(1,8),u=R(2,9);a=t*10+u;b=R(10-u,9);k="add";break;}
  case 13:{const t=R(2,9),u=R(0,7);a=t*10+u;b=R(u+1,9);k="sub";break;}
  default:if(Math.random()<.5){a=R(11,64);b=R(11,Math.min(35,99-a));k="add";}else{a=R(30,99);b=R(11,a-10);k="sub";}
 }
 const ans=k==="add"?a+b:k==="sub"?a-b:k==="add3"?a+b+c:n-a;
 return{k,a,b,c,n,ans,step:st};}
// 하루 동안 같은 연산 문제가 다시 나오지 않게 (오늘 나온 문제 기억)
const mkey=g=>[g.k,g.a,g.b,g.c,g.n].join(",");
function genU(st,kind){if(!S.mseen)S.mseen=[];const order=[st];for(let s=st-1;s>=1;s--)order.push(s);for(let s=st+1;s<=Math.min(MAXSTEP,st+3);s++)order.push(s);for(let s=1;s<=Math.min(MAXSTEP,S.mstep+3);s++)if(!order.includes(s))order.push(s);
 for(const s of order)for(let t=0;t<80;t++){const g=genStep(s);if(kind&&g.k!==kind)continue;const k=mkey(g);if(!S.mseen.includes(k)){S.mseen.push(k);save();return g;}}
 let g;do{g=genStep(st);}while(kind&&g.k!==kind);return g;}
function genMath(){const rev=S.mstep>1&&Math.random()<.25;return genU(rev?R(Math.max(1,S.mstep-4),S.mstep-1):S.mstep);}
function eqHtml(g){const bx=`<span class="box">?</span>`;
 if(g.k==="add")return `${g.a} + ${g.b} = ?`;if(g.k==="sub")return `${g.a} − ${g.b} = ?`;
 if(g.k==="add3")return `${g.a} + ${g.b} + ${g.c} = ?`;if(g.k==="miss")return `${g.a} + ${bx} = ${g.n}`;
 return `${jo(g.n,"은","는")} ${jo(g.a,"과","와")} ${bx}`;}
function explain(g){const{a,b,c,n,ans}=g;
 if(g.k==="add"){if(a<10&&b<10&&a+b>10){const f=10-a;return `${a}에 ${jo(f,"을","를")} 더하면 10! ${jo(b,"을","를")} ${jo(f,"과","와")} ${ro(b-f)} 갈라서 10 + ${b-f} = <b>${ans}</b>`;}
  if(a>=10&&b<10&&a%10+b>=10)return `일의 자리끼리 ${a%10} + ${b} = ${a%10+b}. 10은 십의 자리로 올려 보내서 <b>${ans}</b>`;
  if(a>=10&&b>=10)return `십의 자리끼리 ${Math.floor(a/10)*10} + ${Math.floor(b/10)*10} = ${(Math.floor(a/10)+Math.floor(b/10))*10}, 일의 자리끼리 ${a%10} + ${b%10} = ${a%10+b%10}. 모두 합치면 <b>${ans}</b>`;
  return `${a} + ${b} = <b>${ans}</b>`;}
 if(g.k==="sub"){if(a>10&&a<20&&b>a-10){const f=a-10;return `${a}에서 ${jo(f,"을","를")} 먼저 빼면 10. 남은 ${jo(b-f,"을","를")} 더 빼면 <b>${ans}</b>`;}
  if(a>=20&&b<10&&b>a%10)return `일의 자리 ${a%10}에서 ${jo(b,"을","를")} 뺄 수 없으니 십의 자리에서 10을 빌려 와. ${a%10+10} − ${b} = ${a%10+10-b}, 남은 ${jo((Math.floor(a/10)-1)*10,"과","와")} 합치면 <b>${ans}</b>`;
  return `${a} − ${b} = <b>${ans}</b>`;}
 if(g.k==="add3")return a+b===10?`${a} + ${b} = 10 먼저 만들고, 10 + ${c} = <b>${ans}</b>`:`${a} + ${b} = ${a+b}, ${a+b} + ${c} = <b>${ans}</b>`;
 return `${jo(n,"은","는")} ${jo(a,"과","와")} ${ro(ans)} 가를 수 있어. ${a} + ${ans} = ${n}`;}

function tenFrame(g,ic,bic){let cells=[];

const BC=["#e5574f","#f5a623","#3d8bd9","#4caf6a","#8e5bd6","#e8607a"];
function startCrane(){runSet("crane","크레인 쌓기",[0,1,2,3],null,{render:renderCrane});}
function renderCrane(){const L=S.mstep;let parts;
 if(L<=3)parts=[R(1,3),R(1,2)];else if(L<=7)parts=[R(2,5),R(2,5)];else if(L<=8)parts=[R(1,4),R(1,4),R(1,3)];
 else if(L<=10)parts=[R(5,9),R(3,9)];else if(L<=12)parts=[R(12,40),R(3,9)];else parts=[R(15,30),R(11,25),R(3,9)];
 const T=parts.reduce((a,b)=>a+b,0);const blocks=parts.slice();while(blocks.length<6)blocks.push(R(1,Math.max(3,Math.round(T*.6))));
 Q.cr={T,blocks:shuf(blocks).map((v,k)=>({v,k,used:false})),stack:[]};drawCrane();}
function drawCrane(){const c=Q.cr;
 $("vin").innerHTML=frame(`<div class="story">크레인 기사님 부탁이에요, 소장님! 블록을 골라 높이가 <b>딱 ${c.T}</b>이 되게 쌓아 주세요. 블록 숫자를 더해서 ${c.T}이 되면 성공!</div>
 <div class="crane"><div class="tower"><div class="goal">🏁 목표 ${c.T}</div>${c.stack.map(k=>{const b=c.blocks[k];const h=Math.min(70,26+b.v*2);return `<div class="blk" style="background:${BC[k%6]};height:${h}px;line-height:${h}px">${b.v}</div>`}).join("")}</div>
 <div><div class="pile">${c.blocks.map(b=>`<button class="pblk" style="background:${BC[b.k%6]}" ${b.used?"disabled":""} onclick="putBlk(${b.k})">${b.v}</button>`).join("")}</div>
 <div class="row"><button class="sbtn" onclick="undoBlk()">↩️ 하나 빼기</button><button class="sbtn go" onclick="checkCrane()">🏗️ 다 쌓았어!</button></div></div></div>${NEXT}`);}
function putBlk(k){const c=Q.cr;if(c.over)return;c.blocks[k].used=true;c.stack.push(k);sfx("tap");drawCrane();}
function undoBlk(){const c=Q.cr;if(c.over||!c.stack.length)return;const k=c.stack.pop();c.blocks[k].used=false;drawCrane();}
function checkCrane(){const c=Q.cr;if(c.over||!c.stack.length)return;const vs=c.stack.map(k=>c.blocks[k].v);const sum=vs.reduce((a,b)=>a+b,0);
 const ok=sum===c.T;c.over=true;finishQ(ok,ok?`${vs.join(" + ")} = ${sum}`:`${sum>c.T?"너무 높아서 흔들흔들!":"조금 낮아!"} ${vs.join(" + ")} = ${sum}, 목표는 ${c.T}이었어.`,{q:"크레인 목표 "+c.T,a:c.T,g:vs.join("+")+"="+sum});}

 if(t===1){const L=pickOne([5,8,10,12,15,20]);const lo=shuf(W.filter(w=>w[2]<=L)),hi=shuf(W.filter(w=>w[2]>L));
  if(lo.length&&hi.length>=2){const ok=lo[0],two=hi.slice(0,2);

 if(t===2){let a,b,L;do{[a,b]=shuf(W).slice(0,2);}while(a[2]+b[2]>30);const s=a[2]+b[2];L=pickOne([s-2,s+1,s+3,s]);L=Math.max(L,2);const ok=s<=L;
  return{html:`<div class="story">🏗️ 크레인이 <b>${L}톤</b>까지 들 수 있어요. ${a[1]} ${a[0]}(약 ${a[2]}톤)와 ${b[1]} ${b[0]}(약 ${b[2]}톤)를 <b>한 번에</b> 들 수 있을까요?</div><div class="eq">${a[2]} + ${b[2]} = ?</div>`,lq:`${a[2]}+${b[2]} vs ${L}톤`,
   opts:[{h:"⭕ 들 수 있어요",r:ok},{h:"❌ 너무 무거워요",r:!ok}],cls:"two",ex:`${a[2]} + ${b[2]} = ${s}톤. ${s}${ok?(s===L?"은 딱 "+L+"톤이라 들 수 있어!":"톤은 "+L+"톤보다 가벼워서 들 수 있어!"):"톤은 "+L+"톤보다 무거워서 못 들어!"}`};}
 let a,b;do{[a,b]=shuf(W).slice(0,2);}while(a[2]===b[2]);const hv=a[2]>b[2]?a:b;
 return{html:`<div class="story">⚖️ 저울에 올려 보자! 누가 더 무거울까?</div><div class="emo" style="font-size:80px">${a[1]} ⚖️ ${b[1]}</div>`,lq:`${a[0]} vs ${b[0]}`,

function startGrid(kind){const lv=EXC_LV,cl=CAR_LV,L=kind==="exc"?lv:cl;let s=S.grid[kind]||0;const items=[0,1,2].map(i=>Math.min(s+i,L.length-1));
 if(s>=L.length)items.splice(0,3,...shuf([...L.keys()]).slice(0,3));
 runSet(kind==="exc"?"exc":"route",kind==="exc"?"굴착기 조종":"길 찾기",items,null,{render:()=>gridLoad(kind,Q.items[Q.i])});}
function gridLoad(kind,li){const rows=(kind==="exc"?EXC_LV:CAR_LV)[li];const G={kind,li,rows,h:rows.length,w:rows[0].length,prog:[],att:0,run:false,msg:""};
 rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch==="S")G.start=[x,y];}));gridReset(G);Q.G=G;drawGrid();}
function gridReset(G){G.pos=G.start.slice();G.carry=false;G.dumped=false;G.picked=false;}
const CMD={U:"⬆️",D:"⬇️",L:"⬅️",R:"➡️",P:"🪣",X:"📥"};
function drawGrid(){const G=Q.G,ex=G.kind==="exc";const hasK=G.rows.join("").includes("K");
 const goal=ex?"굴착기를 움직여 🟫 흙더미에서 🪣 퍼고, 🚚 트럭에 가서 📥 부으면 성공!":`자동차를 움직여 🏠 집까지 가요!${hasK?" 가는 길에 🧒 친구를 꼭 태워야 해요.":""}`;
 let cells="";for(let y=0;y<G.h;y++)for(let x=0;x<G.w;x++){const ch=G.rows[y][x];let c="";
  if(ch==="#")c=ex?"🪨":"🚧";if(ch==="D")c=G.carry||G.dumped?"":"🟫";if(ch==="T")c="🚚";if(ch==="H")c="🏠";if(ch==="K")c=G.picked?"":"🧒";
  const me=G.pos[0]===x&&G.pos[1]===y;cells+=`<div class="gc${ch==="#"?" wall":""}">${c}${me?`<span class="bot">${ex?"🚜":"🚗"}${ex&&G.carry?"<i>🟫</i>":""}${!ex&&G.picked?"<i>🧒</i>":""}</span>`:""}</div>`;}
 const btns=ex?"UDLRPX":"UDLR";
 $("vin").innerHTML=frame(`<div class="story">${goal}</div>
 <div class="gridw"><div class="grid" style="grid-template-columns:repeat(${G.w},var(--gc))">${cells}</div>
 <div class="ctrl"><div class="j" style="font-size:19px;margin-bottom:6px">📜 명령 순서 (${G.prog.length}/16)</div><div class="prog">${G.prog.map((c,i)=>`<span class="${G.step===i?"now":""}">${CMD[c]}</span>`).join("")||'<span style="opacity:.4">아래 버튼으로 명령을 넣어요</span>'}</div>
 <div class="cmds">${[...btns].map(c=>`<button class="cmd" ${G.run?"disabled":""} onclick="gAdd('${c}')">${CMD[c]}${c==="P"?"<small>퍼기</small>":c==="X"?"<small>붓기</small>":""}</button>`).join("")}</div>
 <div class="row" style="justify-content:flex-start"><button class="sbtn" ${G.run?"disabled":""} onclick="gDel()">⌫ 하나 지우기</button><button class="sbtn" ${G.run?"disabled":""} onclick="gClear()">🗑️ 모두</button><button class="sbtn go" ${G.run||!G.prog.length||G.done?"disabled":""} onclick="gRun()">▶ 출발!</button>${G.att>=3&&!G.done?`<button class="sbtn" onclick="gSkip()">⏭️ 건너뛰기</button>`:""}</div>
 <div class="gmsg">${G.msg}</div></div></div>${NEXT}`);
 if(G.done){$("ex").innerHTML=G.exh;$("ex").classList.add("on");$("nx").classList.add("on");}}
function gAdd(c){const G=Q.G;if(G.run||G.done||G.prog.length>=16)return;G.prog.push(c);G.msg="";sfx("tap");drawGrid();}
function gDel(){const G=Q.G;if(G.run||G.done)return;G.prog.pop();drawGrid();}
function gClear(){const G=Q.G;if(G.run||G.done)return;G.prog=[];drawGrid();}
function gSkip(){const G=Q.G;G.done=true;finishQ(false,"이번 판은 건너뛰었어. 다음 판에서 다시 도전!",{q:(G.kind==="exc"?"굴착기 ":"길 찾기 ")+(G.li+1)+"판",a:"도착",g:"건너뜀"});G.exh=$("ex").innerHTML;}
function gRun(){const G=Q.G;if(G.run)return;gridReset(G);G.run=true;G.step=0;G.msg="";drawGrid();
 const fail=m=>{G.run=false;G.step=null;G.att++;G.msg="😵 "+m+" 명령을 고쳐서 다시 출발해 봐!";sfx("no");gridReset(G);drawGrid();};
 const tick=()=>{if(Q.G!==G)return;const c=G.prog[G.step];let [x,y]=G.pos;const ex=G.kind==="exc";
  if("UDLR".includes(c)){x+=c==="L"?-1:c==="R"?1:0;y+=c==="U"?-1:c==="D"?1:0;
   if(x<0||y<0||x>=G.w||y>=G.h)return fail("앗! 길 밖으로 나가 버렸어.");if(G.rows[y][x]==="#")return fail(ex?"쿵! 바위에 부딪혔어.":"공사 중인 길이라 못 지나가.");
   G.pos=[x,y];if(G.rows[y][x]==="K")G.picked=true;sfx("tap");}
  else if(c==="P"){if(G.rows[y][x]!=="D"||G.carry||G.dumped)return fail("여기서는 퍼낼 흙이 없어.");G.carry=true;sfx("dig");}
  else if(c==="X"){if(G.rows[y][x]!=="T"||!G.carry)return fail(G.carry?"트럭 칸에서 부어야 해.":"아직 흙을 안 펐어.");G.carry=false;G.dumped=true;sfx("ok");}
  G.step++;drawGrid();
  if(G.step>=G.prog.length){const win=ex?G.dumped:(G.rows[G.pos[1]][G.pos[0]]==="H"&&(!G.rows.join("").includes("K")||G.picked));
   if(!win)return fail(ex?(G.carry?"흙을 퍼긴 했는데 트럭에 붓지 않았어.":"흙을 트럭까지 옮기지 못했어."):(G.rows[G.pos[1]][G.pos[0]]==="H"?"친구를 안 태우고 왔어!":"아직 집에 도착 못 했어."));
   G.run=false;G.step=null;G.done=true;const k=G.kind;S.grid[k]=Math.max(S.grid[k]||0,G.li+1);
   let extra="";if(ex&&Math.random()<.45){const left=DIG.filter(d=>!S.museum.includes(d[0]));if(left.length){const d=pickOne(left);S.museum.push(d[0]);extra=` 🦴 그런데 땅을 파다가 <b>${d[0]} 화석</b>을 발견했어! 공룡 박물관 전시실로 보냈어.`;}}
   save();drawGrid();finishQ(G.att<=1,`명령 ${G.prog.length}개로 성공!${G.att?` (${G.att+1}번째 도전)`:""}${extra}`,{q:(ex?"굴착기 ":"길 찾기 ")+(G.li+1)+"판",a:"성공",g:G.att?(G.att+1)+"번째 성공":"한 번에 성공"});G.exh=$("ex").innerHTML;return;}
  TIMERS.push(setTimeout(tick,520));};
 TIMERS.push(setTimeout(tick,400));}

function renderEn(){const it=Q.items[Q.i],w=it.w,L=EN_LV[S.elv];
 if(it.t==="listen"){const ops=shuf([w,...shuf(L.w.filter(x=>x!==w)).slice(0,2)]);
  renderChoice({html:`<div class="story">🎧 잘 듣고 들리는 단어를 골라 봐!</div><div style="text-align:center"><button class="spk" onclick="sayEn('${w[0]}')">🔊</button></div>`,lq:"듣고 고르기: "+w[0],

 const n=w[0].length;let hide;
 if(it.t==="spell")hide=[...Array(n).keys()];else{const k=S.elv>=3&&n>=4?2:1;hide=shuf([...Array(n).keys()]).slice(0,k).sort((a,b)=>a-b);}
 const extra=it.t==="spell"?(S.elv>=5?2:S.elv>=3?1:0):(S.elv>=3?2:1);
 const pool=[...ABC].filter(c=>!w[0].includes(c));const tiles=shuf(hide.map(i=>w[0][i]).concat(shuf(pool).slice(0,extra))).map(ch=>({ch,used:false}));
 Q.tl={w,hide,fill:[],tiles,done:false};drawTiles();setTimeout(()=>sayEn(w[0]),250);}
function drawTiles(){const z=Q.tl,w=z.w;let fi=0;
 const slots=[...w[0]].map((c,i)=>{if(!z.hide.includes(i))return `<span class="sl fix">${c}</span>`;const f=z.fill[fi++];return `<span class="sl${f!==undefined?" on":""}${z.done?(z.ok?" good":" bad"):""}">${f!==undefined?z.tiles[f].ch:""}</span>`;}).join("");
 $("vin").innerHTML=frame(`<div class="story">${z.hide.length===w[0].length?"✍️ 듣고 스펠링을 맞춰 봐! 글자를 차례대로 눌러요.":"✍️ 빠진 글자를 채워 봐!"}</div>
 <div class="emo" style="font-size:80px">${w[1]}</div><div style="text-align:center"><button class="say" onclick="sayEn('${w[0]}')">🔊 다시 듣기</button></div>
 <div class="slots">${slots}</div>
 <div class="tiles">${z.tiles.map((t,k)=>`<button class="tl" ${t.used||z.done?"disabled":""} onclick="tlTap(${k})">${t.ch}</button>`).join("")}</div>
 <div class="row"><button class="sbtn" ${z.done?"disabled":""} onclick="tlUndo()">↩️ 하나 지우기</button></div>${NEXT}`);
 if(z.done){$("ex").innerHTML=z.exh;$("ex").classList.add("on");$("nx").classList.add("on");}}
function tlTap(k){const z=Q.tl;if(z.done||z.tiles[k].used)return;z.tiles[k].used=true;z.fill.push(k);sfx("tap");
 if(z.fill.length===z.hide.length){const got=z.fill.map(f=>z.tiles[f].ch).join(""),need=z.hide.map(i=>z.w[0][i]).join("");z.ok=got===need;z.done=true;drawTiles();
  let wr=[...z.w[0]],fi=0;z.hide.forEach(i=>{wr[i]=z.tiles[z.fill[fi++]].ch;});
  finishQ(z.ok,`<b>${z.w[1]} ${z.w[0]}</b> <button class="say" onclick="sayEn('${z.w[0]}')">🔊</button> ${[...z.w[0]].join(" - ")}`,{q:(z.hide.length===z.w[0].length?"스펠링: ":"빠진 글자: ")+z.w[0],a:z.w[0],g:wr.join("")});z.exh=$("ex").innerHTML;return;}
 drawTiles();}
function tlUndo(){const z=Q.tl;if(z.done||!z.fill.length)return;z.tiles[z.fill.pop()].used=false;drawTiles();}

 d.packs.filter(p=>p.id<=t).forEach(p=>{if(p.quiz)for(const b in p.quiz)if(QZ[b])add(QZ[b],p.quiz[b],x=>x[0]);

 ${noKo?`<p class="tip" style="color:#c0392b">이 브라우저에서 한국어 목소리를 찾지 못했어요. 그래서 영어 목소리가 한글을 읽어요.</p>`:""}
 <details><summary>갤럭시 탭에서 한글이 영어처럼 들릴 때</summary><ol class="tip">
 <li>설정 → 일반 → <b>텍스트 음성 변환</b> → 기본 엔진을 <b>Google 음성 인식 및 합성</b>으로 고르고, 언어를 <b>한국어</b>로 바꿔 주세요.</li>
 <li>엔진 옆 ⚙️ → 음성 데이터 설치 → <b>한국어</b>를 받아 주세요.</li>
 <li>삼성 인터넷이 아니라 <b>Chrome</b>에서 이 주소를 열고, Chrome 메뉴 → '홈 화면에 추가'로 다시 설치해 주세요.</li>
 <li>앱을 완전히 껐다 켠 뒤 여기서 ▶ 들어 보기를 눌러 확인해요.</li></ol></details></div>`;}
function setVoice(pre,name){S.voice=S.voice||{};if(name)S.voice[pre]=name;else delete S.voice[pre];save();pre==="ko"?sayKo("이 목소리로 읽어 줄게요."):sayEn("hello");}

/* ================= 🧊 냉장고와 먹기 ================= */
const YUM={f1:"고기가 두툼해서 정말 든든해!",f2:"치즈가 쭈욱 늘어나! 정말 맛있다!",f3:"달콤하고 부드러워!",f4:"차가워서 머리가 띵! 그래도 맛있다!",f5:"달콤한 설탕이 솔솔 묻어 있어!",
 f6:"시원하고 달다! 씨는 퉤 뱉어야지.",f7:"고소한 밥알이 쫀득쫀득해!",f8:"꿀꺽꿀꺽! 뼈가 튼튼해지겠다!",f9:"폭신폭신 케이크, 최고야!",f10:"아삭아삭! 새콤달콤해!"};
function openFridge(){setTheme("home");const fs=SHOP.food.filter(f=>S.food[f[0]]>0);
 show(`${header("home","🧊 냉장고","마트에서 산 음식이 시원하게 보관돼 있어요","openHome()")}
 <div class="fridge"><div class="fdoor">🧊 정원이네 냉장고</div><div class="fin">${fs.map(f=>`<button class="fitem" onclick="eatFood('${f[0]}')"><span class="e">${f[2]}</span><span class="n">${f[1]}</span><span class="c">× ${S.food[f[0]]}</span><span class="b">꺼내서 먹기</span></button>`).join("")||'<p class="story" style="grid-column:1/-1;text-align:center">텅 비었어요. 마트에서 음식을 사 오면 여기에 넣어 둘게요!</p>'}</div></div>
 <div class="row"><button class="sbtn go" onclick="openMart('food')">🛒 음식 사러 가기</button><button class="sbtn" onclick="openHome()">🏠 거실로</button></div>`);sfx("door");}
function eatFood(id){if(!(S.food[id]>0))return;const f=SHOP.food.find(x=>x[0]===id);S.food[id]--;save();sfx("tap");
 const line=YUM[id]||"음~ 정말 맛있다!";const av=Object.assign({},S.av,{face:1});
 show(`${header("home","냠냠 시간",f[1]+" 먹는 중!","openFridge()")}
 <svg class="scene eat" viewBox="0 0 1000 580"><rect width="1000" height="580" fill="#fff3e0"/><rect y="420" width="1000" height="160" fill="#d9a86a"/>
 <g transform="translate(500,560) scale(3.4)">${avatar(av)}</g>
 <rect x="290" y="470" width="420" height="22" rx="8" fill="#8a5a33"/><rect x="320" y="492" width="16" height="88" fill="#7a4a23"/><rect x="664" y="492" width="16" height="88" fill="#7a4a23"/><text x="400" y="468" font-size="40">🍽️</text>
 <g class="bite"><text x="0" y="0" font-size="80" text-anchor="middle">${f[2]}</text></g>
 <g class="bubble"><rect x="560" y="40" width="400" height="140" rx="30" fill="#fff" stroke="#f5a623" stroke-width="6"/><path d="M600,175 L560,230 L650,178Z" fill="#fff" stroke="#f5a623" stroke-width="6"/><rect x="590" y="170" width="70" height="14" fill="#fff"/>
  <foreignObject x="580" y="55" width="360" height="115"><div xmlns="http://www.w3.org/1999/xhtml" class="btxt">냠냠! ${line}</div></foreignObject></g>
 <g class="hearts"><text x="330" y="160" font-size="44">❤️</text><text x="640" y="250" font-size="36">💛</text><text x="300" y="300" font-size="30">💕</text></g>
 ${S.pet?`<text x="190" y="560" font-size="80" class="petjump">${petEmoji()}</text><text x="120" y="440" font-size="26" font-family="Jua" fill="#a0522d">나도 한 입!</text>`:""}
 </svg>
 <div class="row"><button class="sbtn go" onclick="openFridge()">🧊 냉장고로</button><button class="sbtn" onclick="openHome()">🏠 거실로</button></div>`);
 setTimeout(()=>{sfx("ok");sayKo("냠냠! "+line);},900);}

/* ================= 🔐 보호자 모드 ================= */
function guardBox(){const left=Math.max(0,LIMIT()-S.used);
 return `<div class="rbox gbox"><h3 class="j">🔐 보호자 모드 (어른용)</h3>
 <p>지금: ${S.guard?'<b style="color:#2e7d32">켜짐</b> — 시간 제한 없음, 모든 건물 열림 (오늘만)':`<b>꺼짐</b> — 오늘 남은 시간 ${Math.floor(left/60)}분 (하루 ${Math.round(LIMIT()/60)}분)`}</p>
 <div class="row" style="justify-content:flex-start">
 ${S.guard?`<button class="sbtn go" onclick="guardOff()">🔒 보호자 모드 끄기</button>`:`<button class="sbtn go" onclick="guardAsk('on')">🔓 보호자 모드 켜기</button>`}
 <button class="sbtn" onclick="guardAsk('t10')">⏱ 오늘 10분 더 주기</button><button class="sbtn" onclick="guardAsk('t30')">⏱ 오늘 30분 더 주기</button></div>
 <p class="tip">보호자 모드는 엄마가 앱을 확인할 때 쓰세요. 켜 있는 동안은 정원이의 하루 30분이 줄지 않고, 공부를 안 해도 모든 건물이 열려요. 내일이 되면 저절로 꺼져요. 켜거나 시간을 더 줄 때는 어른 확인 문제(곱셈)가 나와요.</p>
 <div id="gq"></div></div>`;}
let GQ=null;
function guardAsk(act){const a=6+Math.floor(Math.random()*4),b=12+Math.floor(Math.random()*8),c=10+Math.floor(Math.random()*30);GQ={act,ans:a*b+c};
 $("gq").innerHTML=`<div class="gqb"><b>어른 확인:</b> ${a} × ${b} + ${c} = <input id="gqi" type="number" inputmode="numeric" style="width:110px;font-size:22px;padding:4px 8px;border-radius:10px;border:2px solid #ccc"> <button class="sbtn go" onclick="guardDo()">확인</button></div>`;setTimeout(()=>{const i=$("gqi");if(i)i.focus();},50);}
function guardDo(){const v=+($("gqi")||{}).value;if(!GQ||v!==GQ.ans){toast("답이 달라요. 어른이 풀어 주세요!");sfx("no");return;}
 if(GQ.act==="on"){S.guard=1;toast("🔐 보호자 모드를 켰어요. 오늘은 시간 제한 없이 모두 열려요.");}
 else{const m=GQ.act==="t10"?10:30;S.extra=(S.extra||0)+m*60;toast(`⏱ 오늘 ${m}분을 더 줬어요!`);}
 GQ=null;save();drawTop();$("stop").classList.remove("on");sfx("ok");openReport();}
function guardOff(){S.guard=0;save();drawTop();toast("🔒 보호자 모드를 껐어요.");openReport();}


</script>
